[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bev-tracker"
version = "0.1.0"
description = "Training-free multi-camera BEV stitching and ReID tracking system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Inference
    "torch>=2.1",
    "torchvision>=0.16",
    "ultralytics>=8.0",
    # Numerics
    "numpy>=1.24",
    "scipy>=1.11",
    # Vision
    "opencv-python-headless>=4.8",
    # Filtering
    "filterpy>=1.4",
    # Config
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

# torchreid must be installed separately from source:
#   pip install git+https://github.com/KaiyangZhou/deep-person-reid.git
# It is listed here for documentation purposes only.

[project.scripts]
bev-tracker = "bev_tracker.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bev_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
